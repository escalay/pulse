# Every change: types and tests. On main, the image is then built, run once, pushed to GHCR and signed, and the server
# is told to take it; the run ends when the live /health answers with this commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  image:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # the image on GHCR
      id-token: write # the identity cosign signs with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built and run once before anything is pushed: an image that doesn't answer never reaches the server
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pulse:try
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image and ask it for its health
        run: |
          docker run -d --name try -p 3000:3000 --cap-drop ALL --read-only --tmpfs /tmp pulse:try
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health | grep -q "$GITHUB_SHA"; then exit 0; fi
            sleep 1
          done
          docker logs try
          exit 1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The server pulls the image when asked. Where it is and the key that may ask are the deployment's own, kept as
  # secrets: DEPLOY_URL is the whole address to call, DEPLOY_TOKEN may only start deployments.
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Ask the server to take the new image
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -fsS -o /dev/null -H "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL"
      - name: Wait until the live server answers with this commit
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$HEALTH_URL" | grep -q "$GITHUB_SHA"; then echo "live: $GITHUB_SHA"; exit 0; fi
            sleep 5
          done
          echo "::error::$HEALTH_URL never answered with $GITHUB_SHA"
          exit 1
